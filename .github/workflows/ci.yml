name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  move-behavior:
    name: Move behavior (${{ matrix.os }} / Node 24.21.0)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.8
          cache: false
      - run: mise exec -- bun ci
      - run: mise exec -- bun run test tests/move-*.test.ts

  quality:
    name: Quality (Linux / Node 24.21.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.8
          cache: false
      - run: mise exec -- bun ci
      - run: mise exec -- bun run check
      - run: mise exec -- bun run test:tooling
      - run: mise exec -- bun run test:hooks

  package:
    name: Package (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: '22.22.1' }
          - { os: macos-15, node: '22.22.1' }
          - { os: macos-15, node: '24.21.0' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.8
          cache: false
      - run: mise exec node@${{ matrix.node }} -- bun ci
      - run: mise exec node@${{ matrix.node }} -- bun run build
      - run: mise exec node@${{ matrix.node }} -- bun run test:package
      - run: mise exec node@${{ matrix.node }} -- qmd --version
