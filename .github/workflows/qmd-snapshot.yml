name: Publish QMD snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-qmd-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CI: 'true'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.8
          cache: false
      - run: mise exec -- bun ci
      - run: mise exec -- bun run build
      - run: mise exec -- bun run pack:qmd
      - name: Verify the snapshot through the public Agent Wiki API
        run: |
          export QMD_SNAPSHOT="$PWD/.cache/release/qmd/$(mise exec -- node -e "import('./scripts/qmd-release.ts').then(({ qmdRelease: r }) => console.log(r.name.replace('@', '').replace('/', '-') + '-' + r.version + '.tgz'))")"
          mise exec -- bun run test:package
          mise exec -- bun run test:package:bun
      - run: mise exec -- bun run publish:qmd
