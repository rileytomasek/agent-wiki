name: Publish Agent Wiki

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-agent-wiki
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CI: 'true'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.8
          cache: false
      - run: mise exec -- bun run check:release
      - run: mise exec -- bun ci
      - run: mise exec -- bun run pack:release
      - run: mise exec -- bun run publish:release
      - name: Wait for public registry metadata
        run: |
          release=$(mise exec -- node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')
          for attempt in {1..30}; do
            if mise exec -- npm view "$release" version --prefer-online --fetch-retries=0 --fetch-timeout=5000; then
              exit 0
            fi
            sleep 15
          done
          echo "npm did not expose $release to package-name lookups" >&2
          exit 1
      - name: Verify the public registry package
        run: mise exec -- bun run test:package && mise exec -- bun run test:package:bun
        env:
          AGENT_WIKI_PACKAGE: registry
